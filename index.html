<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindu Gods - Sacred Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0b192c;
            --secondary-blue: #1e3e62;
            --golden: #d4af37;
            --cream-bg: #fdfbf7;
            --dark-charcoal: #222222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans Devanagari', sans-serif, Arial;
            background-color: var(--cream-bg);
            color: var(--dark-charcoal);
            line-height: 1.8;
        }

        .navbar {
            background: var(--primary-blue);
            color: #fff;
            padding: 15px 20px;
            border-bottom: 2px solid var(--golden);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: 'Yatra One', cursive;
            font-size: 20px;
            color: var(--golden);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        h1 {
            color: var(--secondary-blue);
            font-family: 'Yatra One', cursive;
            margin-bottom: 10px;
            font-size: 32px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .gods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .god-card {
            background: #fff;
            border: 2px solid var(--golden);
            padding: 15px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--secondary-blue);
            font-weight: 700;
            font-size: 17px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .god-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--golden);
        }

        .god-card:hover {
            background: var(--secondary-blue);
            color: #fff;
            transform: translateY(-4px);
        }

        footer {
            background: var(--primary-blue);
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            border-top: 2px solid var(--golden);
            font-size: 14px;
        }
/* =========================================================
   PREMIUM 3D TEMPLE OPENING ANIMATION STYLES
   ========================================================= */

body.intro-active {
    overflow: hidden; /* Prevent scrolling while animation is playing */
}

.temple-intro {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #050200;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    perspective: 1800px;
    transition: opacity 1s ease-in-out;
}

/* Step 5: Divine Golden Light from inside */
.divine-light {
    position: absolute;
    width: 250vw;
    height: 250vh;
    background: radial-gradient(circle at center, rgba(255, 230, 100, 0.9) 0%, rgba(212, 175, 55, 0.5) 15%, transparent 60%);
    opacity: 0;
    transform: scale(0.5);
    animation: revealLight 4s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.8s;
    pointer-events: none;
    z-index: 5;
}

/* Step 6: Text Reveal */
.intro-text-container {
    position: absolute;
    text-align: center;
    z-index: 10;
    opacity: 0;
    animation: textFadeIn 2.5s ease-out forwards 2.5s;
}

.intro-logo {
    font-family: 'Yatra One', cursive, sans-serif;
    font-size: 5vw;
    color: #fff;
    text-shadow: 0 0 20px #d4af37, 0 0 50px #ffdf00;
    margin-bottom: 10px;
}

.intro-tagline {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 2vw;
    color: #fdfbf7;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 15px #d4af37;
    font-weight: 600;
}

/* Step 1 & 4: 3D Temple Doors */
.temple-doors {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    z-index: 20;
    transform-style: preserve-3d;
}

.door {
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, #150a00 0%, #3a1f00 20%, #8a5a19 50%, #3a1f00 80%, #150a00 100%);
    position: relative;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
    border: 4px solid var(--golden);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Step 2: Glowing gap between doors */
.door-left {
    transform-origin: left center;
    border-right: 3px solid #ffdf00;
    box-shadow: inset -10px 0 30px rgba(255, 223, 0, 0.2);
    animation: doorGlowLeft 1.5s ease-in forwards, openLeftDoor 3.5s cubic-bezier(0.4, 0, 0.1, 1) forwards 1.8s;
}

.door-right {
    transform-origin: right center;
    border-left: 3px solid #ffdf00;
    box-shadow: inset 10px 0 30px rgba(255, 223, 0, 0.2);
    animation: doorGlowRight 1.5s ease-in forwards, openRightDoor 3.5s cubic-bezier(0.4, 0, 0.1, 1) forwards 1.8s;
}

/* Door Carvings (CSS Art) */
.door-panel {
    width: 65%;
    height: 85%;
    border: 3px solid var(--golden);
    background: rgba(0,0,0,0.4);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 0 15px rgba(212,175,55,0.4);
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    border-radius: 5px;
}

.door-carving {
    width: 50%;
    height: 20%;
    border: 2px solid var(--brass-dark);
    border-radius: 8px;
    background: linear-gradient(135deg, transparent 30%, rgba(212,175,55,0.2) 50%, transparent 70%);
    box-shadow: inset 0 0 15px #000;
}

.door-handle {
    width: 25px;
    height: 100px;
    background: linear-gradient(to bottom, #f4e8c1, #d4af37, #aa8c2c);
    position: absolute;
    border-radius: 12px;
    box-shadow: 3px 5px 15px rgba(0,0,0,0.9), inset 0 0 5px #fff;
    top: 50%;
    transform: translateY(-50%);
    z-index: 30;
}

.door-left .door-handle { right: 10%; }
.door-right .door-handle { left: 10%; }

/* Animations */
@keyframes doorGlowLeft {
    0% { box-shadow: inset -2px 0 5px rgba(255, 223, 0, 0); }
    100% { box-shadow: inset -15px 0 40px rgba(255, 223, 0, 0.7); }
}

@keyframes doorGlowRight {
    0% { box-shadow: inset 2px 0 5px rgba(255, 223, 0, 0); }
    100% { box-shadow: inset 15px 0 40px rgba(255, 223, 0, 0.7); }
}

@keyframes openLeftDoor {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(-105deg); }
}

@keyframes openRightDoor {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(105deg); }
}

@keyframes revealLight {
    0% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
}

@keyframes textFadeIn {
    0% { opacity: 0; transform: translateY(30px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Floating Golden Particles */
.golden-particle {
    position: absolute;
    background: #ffdf00;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 0 10px #ffdf00, 0 0 20px #fff;
    z-index: 15;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(0); opacity: 0; }
    20% { opacity: 0.9; }
    100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
}

/* Responsive fixes & Accessibility */
@media (max-width: 768px) {
    .intro-logo { font-size: 12vw; }
    .intro-tagline { font-size: 4vw; }
    .door-carving { width: 70%; }
}

@media (prefers-reduced-motion: reduce) {
    .temple-intro { display: none !important; }
    body.intro-active { overflow: auto; }
}

    </style>
</head>

            <a href="ganesh.html" class="god-card">

            </a>
            <a href="ram.html" class="god-card">
                <img src="ram.jpg" alt="श्री राम">

    </div>

    <footer>
