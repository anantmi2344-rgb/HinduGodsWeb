<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindu Gods - Sacred Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0b192c;
            --secondary-blue: #1e3e62;
            --crimson-bg: linear-gradient(135deg, #4a0e0e 0%, #2a0808 100%);
            --golden: #d4af37;
            --cream-bg: #fdfbf7;
            --dark-charcoal: #222222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans Devanagari', sans-serif, Arial;
            background-color: var(--cream-bg);
            color: var(--dark-charcoal);
            line-height: 1.8;
        }

        .navbar {
            background: var(--primary-blue);
            color: #fff;
            padding: 15px 20px;
            border-bottom: 2px solid var(--golden);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: 'Yatra One', cursive;
            font-size: 20px;
            color: var(--golden);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        h1 {
            color: var(--secondary-blue);
            font-family: 'Yatra One', cursive;
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .gods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .god-card {
            background: #fff;
            border: 2px solid var(--golden);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--secondary-blue);
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, background 0.3s;
        }

        .god-card:hover {
            background: var(--secondary-blue);
            color: #fff;
            transform: translateY(-4px);
        }

        footer {
            background: var(--primary-blue);
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            border-top: 2px solid var(--golden);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">🔱 सनातन देवी-देवता पोर्टल</div>
    </nav>

    <div class="container">
        <h1>पवित्र देवता दर्शन एवं ज्ञान</h1>
        <p>अपने आराध्य देवी-देवताओं के पावन दर्शन, कथाएँ, आरती और मंत्र चुनें:</p>

        <div class="gods-grid">
            <a href="shiva.html" class="god-card">भगवान शिव</a>
            <a href="hanuman.html" class="god-card">श्री हनुमान</a>
            <a href="krishna.html" class="god-card">श्री कृष्ण</a>
            <a href="durga.html" class="god-card">माँ दुर्गा</a>
            <a href="ganesh.html" class="god-card">श्री गणेश</a>
            <a href="ram.html" class="god-card">श्री राम</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 सनातन पोर्टल. सर्वाधिकार सुरक्षित।</p>
    </footer>

</body>
</html>
